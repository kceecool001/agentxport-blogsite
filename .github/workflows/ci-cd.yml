# ==============================================================
# AgentXport - DevSecOps CI/CD Pipeline
# ==============================================================
# Triggers on every push and pull request.
# Stages: Lint+SCA → Build → Image Scan → IaC Scan → Deploy Manifest Update
# ==============================================================

name: AgentXport DevSecOps Pipeline

on:
  push:
    branches: [main, staging, develop, "feature/*", "hotfix/*"]
  pull_request:
    branches: [main, staging, develop]

# Security: restrict default permissions to read-only
permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/agentxport-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/agentxport-frontend

jobs:
  # ==============================================================
  # STAGE 1: Lint + SCA (combined to share npm ci)
  # ==============================================================
  lint-sca:
    name: "🔍 Lint & Audit (${{ matrix.component }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.component }}
        continue-on-error: true  # Lint warnings should not block pipeline
        run: npm run lint

      # Fail pipeline on high/critical vulnerabilities
      - name: npm audit
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high

  # ==============================================================
  # STAGE 2: Dockerfile Lint (Hadolint) — blocks build
  # ==============================================================
  dockerfile-lint:
    name: "📋 Dockerfile Lint (${{ matrix.component }})"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning

  # ==============================================================
  # STAGE 3: Build & Push Container Images
  # ==============================================================
  build:
    name: "🐳 Build (${{ matrix.component }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-sca, dockerfile-lint]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agentxport-${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ==============================================================
  # STAGE 4: Container Image Scanning (Trivy) — pulls pushed image
  # ==============================================================
  image-scan:
    name: "🔬 Scan (${{ matrix.component }}) Image"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}/agentxport-${{ matrix.component }}:${{ steps.sha.outputs.short }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"

  # ==============================================================
  # STAGE 5: IaC Security Scan (Checkov) — Terraform + K8s
  # ==============================================================
  iac-scan:
    name: "🏗️ IaC Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-sca
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_39,CKV_AWS_58,CKV_TF_1
          output_format: cli
          config_file: .checkov.yml

      - name: Run Checkov on Kubernetes manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true
          output_format: cli

  # ==============================================================
  # STAGE 6: Update Kustomize overlay with new image tag
  # develop → dev | staging → staging | main → prod
  # ==============================================================
  update-manifest:
    name: "🚀 Update Manifest (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/staging' ||
       github.ref == 'refs/heads/develop')
    needs: [image-scan, iac-scan]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve overlay environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "overlay=prod" >> $GITHUB_OUTPUT ;;
            staging) echo "overlay=staging" >> $GITHUB_OUTPUT ;;
            *)       echo "overlay=dev" >> $GITHUB_OUTPUT ;;
          esac

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update image tags in Kustomize overlay
        run: |
          OVERLAY=k8s/overlays/${{ steps.env.outputs.overlay }}/kustomization.yaml
          yq e '(.images[] | select(.name == "*agentxport-backend")).newTag = "${{ steps.sha.outputs.short }}"' -i $OVERLAY
          yq e '(.images[] | select(.name == "*agentxport-frontend")).newTag = "${{ steps.sha.outputs.short }}"' -i $OVERLAY

      - name: Commit and push manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/${{ steps.env.outputs.overlay }}/kustomization.yaml
          git diff --cached --quiet || git commit -m "ci: update ${{ steps.env.outputs.overlay }} images to ${{ steps.sha.outputs.short }} [skip ci]"
          git push
