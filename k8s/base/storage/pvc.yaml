apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentxport-db-pvc
  namespace: agentxport
  labels:
    app.kubernetes.io/part-of: agentxport
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "1.0"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: agentxport-ebs-sc
  resources:
    requests:
      storage: 10Gi
