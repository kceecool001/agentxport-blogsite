# In production, replace with External Secrets Operator or Sealed Secrets.
# echo -n 'agentxport_user'      | base64 → YWdlbnR4cG9ydF91c2Vy
# echo -n 'agentxport_pass_2026' | base64 → YWdlbnR4cG9ydF9wYXNzXzIwMjY=
# echo -n 'agentxport_db'        | base64 → YWdlbnR4cG9ydF9kYg==
apiVersion: v1
kind: Secret
metadata:
  name: agentxport-db-secret
  namespace: agentxport
  labels:
    app.kubernetes.io/part-of: agentxport
    app.kubernetes.io/version: "1.0"
type: Opaque
immutable: true
data:
  POSTGRES_USER: YWdlbnR4cG9ydF91c2Vy
  POSTGRES_PASSWORD: YWdlbnR4cG9ydF9wYXNzXzIwMjY=
  POSTGRES_DB: YWdlbnR4cG9ydF9kYg==
