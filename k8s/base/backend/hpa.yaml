apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentxport-backend-hpa
  namespace: agentxport
  labels:
    app.kubernetes.io/name: agentxport-backend
    app.kubernetes.io/part-of: agentxport
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "1.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentxport-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
