apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentxport-db-allow-backend-only
  namespace: agentxport
  labels:
    app.kubernetes.io/part-of: agentxport
    app.kubernetes.io/version: "1.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentxport-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentxport-backend
      ports:
        - port: 5432
          protocol: TCP
