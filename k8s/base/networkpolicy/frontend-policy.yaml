apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentxport-frontend-allow-public
  namespace: agentxport
  labels:
    app.kubernetes.io/part-of: agentxport
    app.kubernetes.io/version: "1.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentxport-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
