apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentxport-backend-allow-frontend-only
  namespace: agentxport
  labels:
    app.kubernetes.io/part-of: agentxport
    app.kubernetes.io/version: '1.0'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentxport-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentxport-frontend
      ports:
        - port: 5000
          protocol: TCP